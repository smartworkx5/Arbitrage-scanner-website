    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <!-- Suppress harmless WebSocket closure errors in iframe/preview environments -->
    <script>
      (function() {
        window.addEventListener('error', function(event) {
          if (event && event.message && (
            event.message.indexOf('WebSocket') !== -1 ||
            event.message.indexOf('closed without opened') !== -1
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && String(event.reason).indexOf('WebSocket') !== -1) {
            event.preventDefault();
          }
        });
      })();
    </script>
