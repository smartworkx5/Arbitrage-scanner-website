<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="arrowGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#glow)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Outer Orbit Nodes -->
  <circle cx="256" cy="110" r="28" fill="#10b981" filter="url(#shadow)" />
  <circle cx="380" cy="330" r="28" fill="#06b6d4" filter="url(#shadow)" />
  <circle cx="132" cy="330" r="28" fill="#3b82f6" filter="url(#shadow)" />

  <!-- Triangular Arbitrage Loop Path -->
  <path d="M 256 110 L 380 330 L 132 330 Z" fill="none" stroke="url(#glow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="16 8" />

  <!-- Center Pulse Core -->
  <circle cx="256" cy="260" r="54" fill="#0f172a" stroke="url(#glow)" stroke-width="6" />
  <circle cx="256" cy="260" r="32" fill="url(#glow)" />

  <!-- Dynamic Spread / Upward Flash Indicator -->
  <path d="M 242 274 L 256 244 L 270 274 Z" fill="#ffffff" />
  
  <!-- Directional Loop Arrows -->
  <path d="M 320 200 L 340 220 L 310 226" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 266 348 L 246 328 L 246 358" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 180 210 L 190 238 L 165 230" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
